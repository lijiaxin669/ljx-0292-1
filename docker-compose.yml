services:
  tour-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tour-scheduler
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
